name: Build and publish Astro blog
on:
  push:
    branches: [master, astro-blog]
    paths: ['blog/**', '.github/workflows/astro-pages.yml']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astro-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
        working-directory: blog
      - run: npm run build
        working-directory: blog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blog/dist
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
